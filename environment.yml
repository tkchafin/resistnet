name: resistnet
channels:
  - ecoevoinfo
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.10
  - setuptools
  - pip
  - perl
  - pytest
  - flake8
  - numpy
  - pandas>2
  - matplotlib
  - scikit-learn
  - seaborn
  - plotly
  - geopandas
  - sortedcontainers
  - momepy
  - networkx>3
  - pyogrio
  - deap>=1.4
  - nlopt
  - hyperopt
  - mantel
  - pysam
  # River network functions are shared with autoStreamTree
  # (autostreamtree.network); until a release includes them, install it
  # from GitHub (then: - autostreamtree, from the ecoevoinfo channel);
  # pip also updates mantel (>= 2.2.1, for numpy 2) from PyPI
  - pip:
    - git+https://github.com/tkchafin/autostreamtree
